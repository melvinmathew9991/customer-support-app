name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch/PR supersedes the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Deterministic logic only - no Ollama or API key needed (see README).
      # The live eval harness (tests/eval/run_eval.py) needs a local model, so it
      # stays a manual step and is intentionally not run here.
      - name: Unit tests
        run: pytest -q

      # A hard gate: the repo is ruff-clean (see issue #9), so any new finding fails the build.
      - name: Lint (ruff)
        run: ruff check src tests scripts
